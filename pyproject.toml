[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kibsu"
version = "0.8.0"
description = "Reads your coding-agent instructions and reports which of them can actually be verified."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [
    { name = "Mohammed Bajalan" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/M-Bajalan/kibsu"

[tool.setuptools.packages.find]
where = ["."]
include = ["kibsu*"]

# Dev-only tool - not a runtime dependency (kibsu itself still ships with `dependencies = []`
# above; CONTRIBUTING rule 1's "clone and run with zero build step" is about `kibsu` at
# runtime, not about what CI installs to check it). Wired in to satisfy OpenSSF Best
# Practices' `warnings`/`warnings_fixed` criteria: a FLOSS linter must exist and run clean.
[tool.ruff]
line-length = 100
target-version = "py38"

# Pinned explicitly to Ruff's historical, conservative default - E4 (syntax-adjacent),
# E7 (statement-structure), E9 (runtime errors), F (Pyflakes unused/undefined) - rather than
# left unset. An unset `select` inherits whatever this Ruff version's out-of-the-box default
# is, and as of ruff 0.16 that default pulls in ~20 additional stylistic categories (notably
# a preference against %-formatting, used consistently in this codebase's print/error
# strings). Leaving it unset would let a future `pip install --upgrade ruff` silently widen
# CI's failure surface with no PR reviewing what changed. The four codes below already catch
# real mistakes - unused/undefined names, ambiguous single-letter identifiers, multiple
# statements or imports crammed on one line - which is what the criterion means by "catches
# simple mistakes", without opening a large, purely-stylistic rewrite of working, tested code.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
