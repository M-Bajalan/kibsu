[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kibsu"
version = "0.1.0"
description = "Reads your coding-agent instructions and reports which of them can actually be verified."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Mohammed Bajalan" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kibsu/kibsu"

[tool.setuptools.packages.find]
where = ["."]
include = ["kibsu*"]
