# CodeQL code scanning. Findings land in this repository's Security tab, where
# anyone can read them - which is the point. A project that reports on other
# people's unverifiable claims should not ask to be taken on trust about its own.
#
# Two languages are scanned, not one:
#   python  - the package itself (4,781 lines, no dependencies). An earlier revision of
#             this comment said 3,679 - the same blank-line-skipping measurement the
#             README's correction note describes, caught there and missed here until 0.2.0.
#   actions - the workflow files in this directory. GitHub Actions workflow
#             analysis is a first-class CodeQL language, and a supply-chain
#             problem in release.yml would be a more serious defect than
#             anything in the Python, because it is what publishes the package.
#
# Every action is pinned to a full commit SHA, tag in a trailing comment.
#
# An earlier revision of this file used floating major tags (@v4) and argued for
# them here: GitHub's guidance is that a major tag keeps the bundled CodeQL CLI
# current, and a stale analyser is a silent failure - it passes while checking
# less. That objection is real, and pinning alone would have made this comment
# describe a hazard it then walked into.
#
# It is answered by mechanism rather than by argument: dependabot.yml watches the
# github-actions ecosystem and opens a PR when any pinned SHA falls behind. So the
# analyser stays current AND the supply chain is immutable, instead of trading one
# for the other. A rule enforced by a bot beats a rule defended in a comment -
# which is the entire thesis of this repository, applied to this repository.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published query finds this code without a push.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is the widest of the standard suites. This
          # repository is small enough to afford the extra findings, and a
          # finding nobody asked for is the only kind worth adding a scanner for.
          queries: security-and-quality

      # No build step exists or is wanted. Python needs no compilation, and the
      # absence of a build is itself part of the clone-and-run promise in
      # CONTRIBUTING.md - if a build were required here, that promise would be
      # broken somewhere else first.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
