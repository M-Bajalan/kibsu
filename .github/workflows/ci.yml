name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated rather than inherited: this workflow only reads the code.
# Added 2026-07-27 alongside codeql.yml, which scans these workflow files - CodeQL's
# actions pack flags a workflow carrying no permissions block at all, and shipping a
# scanner that immediately reports its own repository would be a poor first impression
# for a project whose argument is that unenforced rules do not get followed.
permissions:
  contents: read

# NOTE (superseded 2026-07-27): an earlier revision of this comment said the repo had no remote
# and that this workflow had never run on a GitHub-hosted runner. That is no longer true - the
# remote exists, the repository is public, v0.1.0 is tagged and published to PyPI, and this
# workflow runs on every push. The stale note is recorded here rather than silently deleted,
# because a comment asserting an unverifiable state was exactly the defect this project reports
# in other people's repositories, and it survived four reviews in this one.
#
# '3.8' is the floor declared in pyproject.toml (`requires-python = ">=3.8"`). It was previously
# untested on any interpreter - this machine runs 3.13 and CI only ever pinned 3.12. A static
# ast-based scan (throwaway script, not part of this repo) parsed every .py file under kibsu/
# and tests/ and found zero syntax/stdlib constructs that post-date 3.8, so the matrix now
# enforces the floor an interpreter actually checks it, instead of leaving it as an untested
# claim in pyproject.toml.
jobs:
  test:
    # These matrix check names ("test (<os>, <py>)") are wired into branch
    # protection's required status checks. Rename the matrix and you must update
    # the protection contexts in the same motion, or every merge waits forever
    # on checks that no longer exist - this repo hit exactly that once.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.12']
        exclude:
          # macos-latest runners are arm64 and CPython 3.8 ships no arm64 build,
          # so the 3.8 floor is enforced on ubuntu + windows; macos tests the
          # current line. kibsu is path-handling-heavy - the windows leg is not
          # decoration, it is where this codebase's bugs have actually lived.
          - os: macos-latest
            python-version: '3.8'
    steps:
      # Pinned to SHAs, kept current by dependabot.yml. See codeql.yml's header for
      # why the two are one decision and not two.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python -m unittest discover -s tests

