# Release to PyPI via Trusted Publishing (OIDC). No API token exists anywhere -
# a project whose provenance file explains why it does not ship its own secrets
# should not keep one in its CI settings either.
#
# Fires only on a version tag (v*). The publish job runs in the 'pypi'
# environment, which must be registered as this project's trusted publisher on
# PyPI (owner M-Bajalan, repository kibsu, workflow release.yml, environment pypi).
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege at the top, widened only in the one job that needs it. The publish
# job below adds `id-token: write` for the OIDC exchange and nothing else - it never
# gets `contents: write`, so a compromised release run cannot rewrite this repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to SHAs, kept current by dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # A release that skips its own tests is a claim without evidence.
      - name: Run test suite
        run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.5.0
          python -m build
      # >>> MUST MATCH roundtrip.yml <<<
      # This action and the download-artifact below are the only pair in this repository
      # that no pull request can exercise - release.yml fires only on a `v*` tag. They are
      # tested by .github/workflows/roundtrip.yml, which pins the SAME two SHAs and proves
      # a real sdist + wheel survive the cross-job round trip byte-identical, with the
      # assertion itself unit-tested in tests/test_assert_dist_roundtrip.py. Change these
      # two lines and change them there, or the publish path goes untested again.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # >>> MUST MATCH roundtrip.yml <<< (see the note on upload above)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # The most valuable pin in the repository. This was `@release/v1` - a BRANCH,
      # which upstream can move at any moment, on the one step that publishes the
      # package to PyPI. A mutable ref on the publish step is a supply-chain hole in
      # the exact place a project about verifiable claims can least afford one.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    # Attach the exact artifacts PyPI received to the GitHub release, plus a
    # build-provenance attestation (an in-toto/SLSA bundle, signed via sigstore
    # OIDC - no key exists to leak, same argument as Trusted Publishing above).
    # Scorecard's Signed-Releases check reads release assets; a visitor can
    # verify any downloaded wheel came from THIS workflow on THIS commit:
    #   gh attestation verify kibsu-*.whl -R M-Bajalan/kibsu
    # Runs AFTER publish so a failure here can never block PyPI, and it is
    # re-runnable from the Actions tab. Like the upload/download pair above,
    # no PR can exercise this job - it first fires at the next v* tag; that
    # blind spot is accepted and documented here rather than hidden.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release + upload assets
      id-token: write      # sigstore OIDC exchange for the attestation
      attestations: write  # store the attestation in the repo's attestation log
    steps:
      # >>> MUST MATCH roundtrip.yml <<< (see the note on upload in build above)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: "dist/*"
      - name: Attach artifacts and provenance to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "dist/kibsu-${GITHUB_REF_NAME#v}.intoto.jsonl"
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber
