# Release to PyPI via Trusted Publishing (OIDC). No API token exists anywhere -
# a project whose provenance file explains why it does not ship its own secrets
# should not keep one in its CI settings either.
#
# Fires only on a version tag (v*). The publish job runs in the 'pypi'
# environment, which must be registered as this project's trusted publisher on
# PyPI (owner M-Bajalan, repository kibsu, workflow release.yml, environment pypi).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A release that skips its own tests is a claim without evidence.
      - name: Run test suite
        run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
