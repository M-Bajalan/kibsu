# Release to PyPI via Trusted Publishing (OIDC). No API token exists anywhere -
# a project whose provenance file explains why it does not ship its own secrets
# should not keep one in its CI settings either.
#
# Fires only on a version tag (v*). The publish job runs in the 'pypi'
# environment, which must be registered as this project's trusted publisher on
# PyPI (owner M-Bajalan, repository kibsu, workflow release.yml, environment pypi).
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege at the top, widened only in the one job that needs it. The publish
# job below adds `id-token: write` for the OIDC exchange and nothing else - it never
# gets `contents: write`, so a compromised release run cannot rewrite this repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to SHAs, kept current by dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # A release that skips its own tests is a claim without evidence.
      - name: Run test suite
        run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.5.0
          python -m build
      # >>> MUST MATCH roundtrip.yml <<<
      # This action and the download-artifact below are the only pair in this repository
      # that no pull request can exercise - release.yml fires only on a `v*` tag. They are
      # tested by .github/workflows/roundtrip.yml, which pins the SAME two SHAs and proves
      # a real sdist + wheel survive the cross-job round trip byte-identical, with the
      # assertion itself unit-tested in tests/test_assert_dist_roundtrip.py. Change these
      # two lines and change them there, or the publish path goes untested again.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # >>> MUST MATCH roundtrip.yml <<< (see the note on upload above)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # The most valuable pin in the repository. This was `@release/v1` - a BRANCH,
      # which upstream can move at any moment, on the one step that publishes the
      # package to PyPI. A mutable ref on the publish step is a supply-chain hole in
      # the exact place a project about verifiable claims can least afford one.
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
