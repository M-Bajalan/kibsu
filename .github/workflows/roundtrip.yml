# Artifact roundtrip - the checker release.yml never had.
#
# WHY THIS EXISTS
# release.yml uploads `dist/` in its `build` job, downloads it in `publish`, and hands the
# result to pypa/gh-action-pypi-publish. It triggers ONLY on a `v*` tag, so no pull request
# has ever exercised it: a bump to upload-artifact or download-artifact lands with green CI
# and is first tested by an actual release. That is the one path in this repository with no
# test and the highest cost of failure. This workflow is that test.
#
# >>> MUST MATCH release.yml <<<
# The upload-artifact and download-artifact pins below must equal the pins in
# .github/workflows/release.yml, which carries the mirror of this note. Dependabot groups
# every action bump into one pull request, so a future bump moves BOTH files together and
# this workflow exercises the new versions ON that pull request, before it can be merged.
# That is how release.yml's blind spot stays closed - structurally, not by anyone remembering.
# It already worked once: PR #1 bumped upload v4.6.2 -> v7.0.1 and download v4.3.0 -> v8.0.1,
# this workflow ran green on the PR branch, and the merge happened on evidence rather than on
# a reading of release notes.
#
# THE ASSERTION LIVES IN tools/assert_dist_roundtrip.py, NOT HERE
# It was previously inline, in two heredoc copies - which made it the one checker in this
# repository that `python -m unittest` could not reach. A check nobody can check is the exact
# defect this project reports in other people's repositories. It is now a module with its own
# tests in tests/test_assert_dist_roundtrip.py, and every failing branch is driven to fail
# there on every test run (CONTRIBUTING.md, rule 4).
#
# THE BASELINE LEG IS GONE, AND WHY IT HAD TO BE
# An earlier revision carried a second leg pinned to the pre-bump versions, as a control for
# "is it the actions or the checker?". Dependabot bumped BOTH legs on its very first pull
# request, leaving two byte-identical legs while one of them still called itself a baseline -
# a control that had silently stopped controlling anything, which is worse than no control at
# all. The durable answer is the negative control below: it cannot be eroded by a version bump
# because it does not depend on a version.
#
# ON PIPES: the shell blocks run with `set -euo pipefail`, so a pipe cannot silently swallow a
# failure. Where an exit code is the thing being measured, it is captured bare.
name: Artifact roundtrip

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    name: build + upload
    runs-on: ubuntu-latest
    outputs:
      sha_sdist: ${{ steps.hash.outputs.sha_sdist }}
      sha_wheel: ${{ steps.hash.outputs.sha_wheel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Real distributions, exactly as release.yml builds them. A fabricated file named .whl
      # would not exercise download-artifact's unzip behaviour at all - the wheel IS a zip,
      # and that is the property under test.
      - name: Build real distributions
        run: |
          set -euo pipefail
          python -m pip install --quiet build==1.5.0
          python -m build
          ls -l dist/
      - name: Record pre-upload hashes
        id: hash
        run: |
          set -euo pipefail
          sdist=$(ls dist/*.tar.gz)
          wheel=$(ls dist/*.whl)
          echo "sha_sdist=$(sha256sum "$sdist" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_wheel=$(sha256sum "$wheel" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # >>> MUST MATCH release.yml <<<
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roundtrip-dist
          path: dist/

  download-and-assert:
    name: download + assert
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST - it cleans the workspace, and it is what brings
      # tools/assert_dist_roundtrip.py onto the runner. Downloading before this would wipe
      # the artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # >>> MUST MATCH release.yml <<<
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roundtrip-dist
          path: dist/
      - name: Assert the publish contract
        env:
          EXPECT_SDIST: ${{ needs.build-and-upload.outputs.sha_sdist }}
          EXPECT_WHEEL: ${{ needs.build-and-upload.outputs.sha_wheel }}
        run: |
          set -euo pipefail
          python tools/assert_dist_roundtrip.py dist
      - name: Negative control · the assertion must be able to fail
        env:
          EXPECT_SDIST: ${{ needs.build-and-upload.outputs.sha_sdist }}
          EXPECT_WHEEL: ${{ needs.build-and-upload.outputs.sha_wheel }}
        run: |
          set -euo pipefail
          # Rebuild the exact failure this workflow exists to catch: the two distributions
          # arrive wrapped in a single archive instead of extracted side by side. This control
          # depends on no version, so no dependency bump can quietly erode it.
          rm -rf /tmp/corrupt && mkdir -p /tmp/corrupt
          (cd dist && zip -q /tmp/corrupt/dist.zip ./*)
          set +e
          python tools/assert_dist_roundtrip.py /tmp/corrupt
          code=$?
          set -e
          echo "assertion exit code on deliberately wrapped input: $code"
          if [ "$code" -eq 0 ]; then
            echo "NEGATIVE CONTROL FAILED - the assertion passed on a wrapped artifact."
            echo "The checker cannot fail, so its green result above means nothing."
            exit 1
          fi
          echo "Negative control OK: the assertion caught it."
